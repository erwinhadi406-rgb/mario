<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Super Math Run</title>
<style>

.ch{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vmin,20px);margin:0}.ch.one{grid-template-columns:1fr}
.opt{--c1:#60a5fa;--c2:#2563eb;--sh:#1e40af;font:inherit;font-weight:900;color:#fff;border:0;cursor:pointer;display:flex;align-items:center;gap:.6em;padding:.35em .6em .35em .35em;min-height:clamp(60px,12vmin,140px);font-size:clamp(24px,min(6.5vw,6.5vmin),68px);border-radius:clamp(14px,2.4vmin,26px);background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 6px 0 var(--sh),0 10px 18px rgba(0,0,0,.2);text-shadow:0 2px 0 rgba(0,0,0,.25);animation:optin .4s both;transition:transform .12s,filter .2s}
.opt.o1{--c1:#fbbf24;--c2:#f97316;--sh:#b45309}.opt.o2{--c1:#4ade80;--c2:#16a34a;--sh:#166534}.opt.o3{--c1:#f9a8d4;--c2:#ec4899;--sh:#9d174d}
.opt .lt{flex:none;width:1.35em;height:1.35em;border-radius:50%;background:rgba(255,255,255,.92);color:var(--sh);display:flex;align-items:center;justify-content:center;font-size:.55em;text-shadow:none}
.opt .tx{flex:1;text-align:center;padding-right:.9em;word-break:break-word}
@media(hover:hover){.opt:hover:not(:disabled){transform:translateY(-3px) scale(1.02);filter:brightness(1.08)}}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--sh)}
.opt:disabled{cursor:default;filter:grayscale(.85) brightness(.9);opacity:.45;transform:none}
.opt.right:disabled{filter:none;opacity:1;--c1:#4ade80;--c2:#16a34a;--sh:#15803d;animation:glow 1s 2}
.msw{min-height:clamp(56px,10vmin,130px);display:flex;align-items:center;justify-content:center}

.fb small{font-size:.85em;font-weight:600}
.fb.ok{background:rgba(34,197,94,.18);border:2px solid #22c55e;color:#15803d}
.fb.hint{background:rgba(245,158,11,.18);border:2px solid #f59e0b;color:#b45309}
.fb.bad{background:rgba(59,130,246,.14);border:2px solid #3b82f6}
.b.big{font-size:clamp(18px,3vmin,32px);min-height:clamp(48px,8vmin,84px);align-self:center;padding:.4em 1.4em}
.cf{position:absolute;inset:0;pointer-events:none;overflow:hidden}.cf span{position:absolute;left:50%;top:55%;animation:fly 1.2s ease-out both}
@media(max-height:520px){.qb{padding:8px 12px;gap:6px}.qq{padding:.15em .3em}.qp .qimg{max-height:20vh}.msw{min-height:44px}}

@media(prefers-reduced-motion:reduce){#ovc.qp,.opt,.fb,.cf span{animation:none!important}}
textarea{font:inherit}

@media(min-width:1100px){#ovc:not(.qp){max-width:min(92vw,820px);padding:22px}#ovc:not(.qp) h1{font-size:44px}#ovc:not(.qp) h2{font-size:34px}#ovc:not(.qp) p{font-size:22px}.b{font-size:22px;min-height:58px;padding:12px 22px;border-radius:16px}#ovc:not(.qp) table{font-size:19px}td,th{padding:8px}select,input{font-size:22px;padding:10px 12px}}
@media(min-width:1600px){#ovc:not(.qp){max-width:min(90vw,1100px);padding:32px;border-radius:24px}#ovc:not(.qp) h1{font-size:64px}#ovc:not(.qp) h2{font-size:48px}#ovc:not(.qp) p{font-size:30px}.b{font-size:32px;min-height:84px;padding:16px 34px;border-radius:22px;margin:6px;box-shadow:0 6px 0 rgba(0,0,0,.25)}#ovc:not(.qp) table{font-size:28px}td,th{padding:12px}select,input{font-size:30px;padding:14px 16px;border-radius:14px}.bar{height:22px}.tries{font-size:28px}}
@media(min-width:2400px){#ovc:not(.qp){max-width:min(88vw,1500px);padding:44px}#ovc:not(.qp) h1{font-size:92px}#ovc:not(.qp) h2{font-size:68px}#ovc:not(.qp) p{font-size:44px}.b{font-size:46px;min-height:116px;padding:22px 48px;border-radius:30px}#ovc:not(.qp) table{font-size:40px}td,th{padding:16px}select,input{font-size:42px;padding:18px 22px}.bar{height:30px}.tries{font-size:40px}}
#rot{position:fixed;left:50%;top:max(10px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:10px;background:#f59e0b;color:#1d2b45;font-weight:800;font-size:15px;padding:10px 14px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.3);max-width:92vw;text-align:left}
#rot button{font:inherit;border:0;background:rgba(0,0,0,.18);border-radius:10px;padding:6px 10px;cursor:pointer;color:inherit}
@media(orientation:portrait) and (max-width:700px) and (pointer:coarse){#rot.on{display:flex}}
</style></head><body>
<div id="rot" class="on">📱↻ Putar HP ke mode <u>landscape</u> agar game lebih besar<button onclick="this.parentNode.classList.remove('on');this.parentNode.dataset.x=1">OK</button></div><div id="w"><canvas id="cv" width="640" height="352"></canvas></div>
<div id="ctl"><div id="mvz"><div id="joy"><div id="kn"></div></div><div id="dp"><div class="tc" id="tl">◀</div><div class="tc" id="tr">▶</div><div class="tc" id="td">▼</div></div></div><div id="ac"><div class="tc" id="tf">🔥</div><div class="tc" id="tj">⤒</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const cv=$('#cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const TS=32,VW=640,VH=352;
const W=[{n:'Desa Angka',e:'🏠',sky:'#7fc8ff',top:'#4ade80',dirt:'#a16207',pipe:'#16a34a',t:'Berhitung'},
{n:'Hutan Penjumlahan',e:'🌳',sky:'#a7f3d0',top:'#22c55e',dirt:'#854d0e',pipe:'#15803d',t:'Penjumlahan'},
{n:'Gunung Pengurangan',e:'🏔️',sky:'#c7d2fe',top:'#f1f5f9',dirt:'#64748b',pipe:'#6366f1',t:'Pengurangan'},
{n:'Planet Perkalian',e:'🚀',sky:'#3b2a8c',top:'#c084fc',dirt:'#581c87',pipe:'#ec4899',t:'Perkalian'},
{n:'Laut Pembagian',e:'🌊',sky:'#67e8f9',top:'#fde68a',dirt:'#d97706',pipe:'#0891b2',t:'Pembagian'}];
const LV=[['Pemula','🔰',0],['Penjelajah Angka','🧭',100],['Ahli Penjumlahan','⭐',300],['Ahli Pengurangan','🏆',600],['Master Matematika','👑',1000]];
const OB=['🍎','🍭','⭐','🍌','🐟','🍪'];
const DEF={name:'',xp:0,coins:0,unlocked:1,lv:0,stars:[0,0,0,0,0],st:[0,1,2,3,4].map(()=>({n:0,ok:0,bad:0,tr:0})),log:[]};
let S;try{S=JSON.parse(localStorage.getItem('smr')||'null')}catch(e){}S=Object.assign(JSON.parse(JSON.stringify(DEF)),S||{});
const save=()=>{try{localStorage.setItem('smr',JSON.stringify(S))}catch(e){}};
const lvl=()=>{let i=0;LV.forEach((l,k)=>{if(S.xp>=l[2])i=k});return i};
let ac;function snd(f,d=.12,t='square',f2){try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;if(f2)o.frequency.linearRampToValueAtTime(f2,ac.currentTime+d);g.gain.value=.035;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const sJ=()=>snd(300,.18,'square',700),sC=()=>{snd(988,.07);setTimeout(()=>snd(1319,.15),70)},sBad=()=>snd(180,.25,'triangle',120),sSt=()=>snd(200,.1,'square',80),sOk=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.15),i*90));
let mus=0;function music(){if(mus)return;mus=1;const n=[523,523,659,523,784,659,587,494];let i=0;setInterval(()=>{if(G.mode=='play')snd(n[i++%8]/2,.18,'triangle')},260)}
function gen(z,lv){const m=[10,20,50][lv],mx=[5,8,10][lv];let q,ans,ex,items='',op=[];
if(z==0){const t=R(0,2);if(t==0){const n=R(1,[10,15,20][lv]);q='Ada berapa benda ini?';ans=n;items=OB[R(0,5)].repeat(n);ex=`Hitung satu per satu: ada ${n}.`}
else if(t==1){const a=R(1,m>20?30:m),b=R(1,m>20?30:m),bb=a==b?b+1:b;q=`Mana yang LEBIH BESAR: ${a} atau ${bb}?`;ans=Math.max(a,bb);op=[a,bb];ex=`${a} dan ${bb}: yang lebih besar adalah ${ans}.`}
else{const a=R(3,9),b=R(1,a-1);q='Berapa selisih benda kiri dan kanan?';items=OB[0].repeat(a)+' ⚖️ '+OB[1].repeat(b);ans=a-b;ex=`${a} - ${b} = ${ans}.`}}
else if(z==1){const h=Math.max(3,m/2|0),a=R(1,h),b=R(1,h);q=`${a} + ${b} = ?`;ans=a+b;ex=a<10&&a+b>10?`${a} + ${10-a} = 10, lalu 10 + ${b-(10-a)} = ${ans}`:`Hitung maju ${b} langkah dari ${a} → ${ans}`;if(a+b<=12&&Math.random()<.5){items=OB[0].repeat(a)+' + '+OB[0].repeat(b);q='Berapa jumlah apel semuanya?'}}
else if(z==2){const a=R(3,m),b=R(1,a-1);q=`${a} - ${b} = ?`;ans=a-b;ex=`Mulai dari ${a}, mundur ${b} langkah → ${ans}.`;if(a<=10&&Math.random()<.5){items=OB[1].repeat(a);q=`Ambil ${b} permen. Sisa berapa?`}}
else if(z==3){const a=R(2,mx),b=R(2,mx);q=`${a} × ${b} = ?`;ans=a*b;ex=`${a} × ${b} = ${Array(b).fill(a).join(' + ')} = ${ans}`;if(a*b<=30&&Math.random()<.5){items=Array(b).fill(OB[2].repeat(a)).join(' | ');q=`${b} kelompok, tiap kelompok ${a}. Semua berapa?`}}
else{const b=R(2,mx),c=R(2,mx),a=b*c;q=`${a} ÷ ${b} = ?`;ans=c;ex=`${a} dibagi rata ke ${b} bagian → tiap bagian ${c}, karena ${b} × ${c} = ${a}.`;if(a<=30&&Math.random()<.5){items=OB[3].repeat(a);q=`${a} pisang dibagi rata ke ${b} anak. Tiap anak dapat?`}}
const s=new Set([ans,...op]);let k=0;while(s.size<4&&k++<80){const v=ans+R(-4,4);if(v>=0)s.add(v)}
let o=[...s];if(o.length>4)o=[ans,...o.filter(v=>v!=ans).slice(0,3)];return{q,ans,ex,items,opts:shuf(o)}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CQ=[];try{CQ=JSON.parse(localStorage.getItem('smr_q')||'[]')}catch(e){}if(!Array.isArray(CQ))CQ=[];
const saveQ=()=>{try{localStorage.setItem('smr_q',JSON.stringify(CQ))}catch(e){}};

function jm(e){const r=jo.getBoundingClientRect(),h=r.width/2,mx=h*.6;let dx=e.clientX-r.left-h,dy=e.clientY-r.top-h;const d=Math.hypot(dx,dy);if(d>mx){dx*=mx/d;dy*=mx/d}kn.style.transform=`translate(-50%,-50%) translate(${dx}px,${dy}px)`;const nx=dx/mx;K.arrowleft=nx<-.3?1:0;K.arrowright=nx>.3?1:0;K.shift=Math.abs(nx)>.9?1:0;K.arrowdown=dy/mx>.55?1:0}
jo.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;jo.setPointerCapture(jid);jm(e);music()});jo.addEventListener('pointermove',e=>{if(e.pointerId==jid)jm(e)});
const jend=()=>{jid=null;K.arrowleft=K.arrowright=K.shift=K.arrowdown=0;kn.style.transform='translate(-50%,-50%)'};jo.addEventListener('pointerup',jend);jo.addEventListener('pointercancel',jend);
document.addEventListener('contextmenu',e=>e.preventDefault());
[['#tl','arrowleft'],['#tr','arrowright'],['#td','arrowdown'],['#tj','j'],['#tf','x']].forEach(([s,k])=>{const e=$(s);e.addEventListener('pointerdown',ev=>{ev.preventDefault();K[k]=1;music()});['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,()=>K[k]=0))});
S.ctl=Object.assign({mode:'joy',size:1,sw:0,gap:'auto',dev:(matchMedia('(pointer:coarse)').matches||(navigator.maxTouchPoints>=5&&innerWidth>=1800))?'touch':'pc'},S.ctl||{});

build(0);G.mode='menu';applyCtl();loop(0);S.name?menu():ask();
